[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-cua"
version = "3.0.0"
description = "Automate any app — desktop or browser — with composable, typed steps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Aadya" }]
keywords = ["computer-use", "agent", "automation", "desktop", "browser", "accessibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "pydantic>=2.0",
    "litellm>=1.77.7",
    "requests>=2.32.5",
    "patchright>=1.42.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.11.0",
    "ddgs>=9.13.0",
]

[project.optional-dependencies]
# Firefox/WebKit are driven through a patched protocol that only stock
# Playwright implements. Chromium-family browsers need nothing extra.
firefox = ["playwright>=1.40"]
webkit = ["playwright>=1.40"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/aadya940/orbit"
Repository = "https://github.com/aadya940/orbit"
Issues = "https://github.com/aadya940/orbit/issues"



[tool.setuptools.packages.find]
where = ["."]
include = ["orbit*"]

[tool.setuptools.package-data]
orbit = ["_bin/*"]
